    <script>
        const checkboxes = document.querySelectorAll('.check-servicio');
        const displayTotal = document.getElementById('total-presupuesto');

        function calcularTotal() {
            let total = 0;
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    // Sumamos el valor asegurándonos que sea un número
                    total += parseInt(cb.value) || 0;
                }
            });
            displayTotal.innerText = total.toLocaleString('es-AR');
        }

        checkboxes.forEach(cb => {
            cb.addEventListener('change', calcularTotal);
        });

        function enviarWhatsApp() {
            const telefono = "5491161272389";
            const totalActual = displayTotal.innerText;
            const seleccionados = [];
            
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    // Buscamos el texto del servicio dentro de la card
                    const label = cb.closest('.custom-card-check');
                    const nombre = label.querySelector('span').innerText;
                    seleccionados.push(nombre);
                }
            });

            if (seleccionados.length === 0) {
                alert("Por favor, seleccioná al menos un servicio para solicitar el turno.");
                return;
            }

            let mensaje = `Hola Kariso Estética! Me gustaría pedir un turno para:%0A%0A`;
seleccionados.forEach(s => mensaje += `- ${s}%0A`);
mensaje += `%0A*Total estimado: $${totalActual}*%0A%0A¿Qué turnos tenés disponibles?`;

            const url = `https://wa.me/${telefono}?text=${mensaje}`;
            window.open(url, '_blank');
        }
    </script>
